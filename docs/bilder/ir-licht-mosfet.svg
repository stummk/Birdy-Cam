<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="618" fill="none" stroke="#d5dbe4" stroke-width="2" rx="6"/>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16232f">Das unsichtbare Nachtlicht — MOSFET und die vier IR-LEDs</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#5b6b7d">Der MOSFET ist ein Lichtschalter, den der XIAO bedienen kann, ohne selbst die Kraft aufzubringen.</text>

  <!-- ============ Kabel ============ -->
  <!-- D0 -> SIG -->
  <path d="M 214 158 L 330 158" fill="none" stroke="#d99400" stroke-width="4"/>
  <!-- GND -> GND (Signalseite) -->
  <path d="M 214 190 L 330 190" fill="none" stroke="#2b3440" stroke-width="4"/>
  <!-- 5V -> VIN+ -->
  <path d="M 214 262 L 270 262 L 270 296 L 330 296" fill="none" stroke="#d1332e" stroke-width="4"/>
  <!-- GND -> VIN- -->
  <path d="M 214 294 L 250 294 L 250 328 L 330 328" fill="none" stroke="#2b3440" stroke-width="4"/>

  <!-- OUT+ / OUT- zu den LEDs -->
  <path d="M 594 301 L 660 301 L 660 140" fill="none" stroke="#d1332e" stroke-width="4"/>
  <path d="M 594 333 L 690 333 L 690 140" fill="none" stroke="#2b3440" stroke-width="4"/>
  <line x1="660" y1="140" x2="660" y2="470" stroke="#d1332e" stroke-width="4"/>
  <line x1="690" y1="160" x2="690" y2="470" stroke="#2b3440" stroke-width="4"/>

  <line x1="660" y1="152" x2="756" y2="152" stroke="#d1332e" stroke-width="3"/>
  <line x1="690" y1="172" x2="756" y2="172" stroke="#2b3440" stroke-width="3"/>
  <line x1="660" y1="232" x2="756" y2="232" stroke="#d1332e" stroke-width="3"/>
  <line x1="690" y1="252" x2="756" y2="252" stroke="#2b3440" stroke-width="3"/>
  <line x1="660" y1="312" x2="756" y2="312" stroke="#d1332e" stroke-width="3"/>
  <line x1="690" y1="332" x2="756" y2="332" stroke="#2b3440" stroke-width="3"/>
  <line x1="660" y1="392" x2="756" y2="392" stroke="#d1332e" stroke-width="3"/>
  <line x1="690" y1="412" x2="756" y2="412" stroke="#2b3440" stroke-width="3"/>

  <!-- ============ XIAO ============ -->
  <rect x="30" y="110" width="184" height="220" rx="9" fill="#eaf6ef" stroke="#2f7d4f" stroke-width="2.5"/>
  <text x="122" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">XIAO ESP32-S3</text>

  <rect x="46" y="146" width="152" height="26" rx="4" fill="#fffbeb" stroke="#d99400" stroke-width="2"/>
  <text x="122" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">D0 — Signal</text>

  <rect x="46" y="178" width="152" height="26" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="122" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#16232f">GND</text>

  <rect x="46" y="250" width="152" height="26" rx="4" fill="#fef2f2" stroke="#d1332e" stroke-width="2"/>
  <text x="122" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#a02320">5V</text>

  <rect x="46" y="282" width="152" height="26" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="122" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#16232f">GND</text>

  <text x="122" y="326" text-anchor="middle" font-size="11" fill="#5b6b7d">liefert nur ein Signal</text>

  <!-- ============ MOSFET ============ -->
  <rect x="330" y="110" width="280" height="250" rx="9" fill="#eef4fb" stroke="#3b5573" stroke-width="2.5"/>
  <text x="470" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">MOSFET-Modul D4184</text>

  <text x="346" y="160" font-size="11" font-weight="bold" fill="#5b6b7d">STEUERSEITE (winzige Ströme)</text>
  <rect x="346" y="168" width="70" height="24" rx="4" fill="#fffbeb" stroke="#d99400"/>
  <text x="381" y="185" text-anchor="middle" font-size="12" fill="#92400e">SIG</text>
  <rect x="422" y="168" width="70" height="24" rx="4" fill="#f1f5f9" stroke="#334155"/>
  <text x="457" y="185" text-anchor="middle" font-size="12" fill="#16232f">GND</text>
  <rect x="498" y="168" width="96" height="24" rx="4" fill="#fdf2f8" stroke="#a3477b"/>
  <text x="546" y="185" text-anchor="middle" font-size="11" fill="#a3477b">VCC (falls da)</text>
  <text x="346" y="210" font-size="11" font-style="italic" fill="#5b6b7d">Heißt je nach Modul SIG, PWM oder TRIG</text>

  <line x1="346" y1="224" x2="594" y2="224" stroke="#b9c7d6" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="346" y="248" font-size="11" font-weight="bold" fill="#5b6b7d">LASTSEITE (Schraubklemmen)</text>
  <rect x="346" y="258" width="80" height="26" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="386" y="276" text-anchor="middle" font-size="12" fill="#2b3440">rein</text>
  <rect x="514" y="258" width="80" height="26" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="554" y="276" text-anchor="middle" font-size="12" fill="#2b3440">raus</text>

  <rect x="346" y="288" width="52" height="26" rx="4" fill="#fef2f2" stroke="#d1332e"/>
  <text x="372" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#a02320">VIN+</text>
  <rect x="346" y="320" width="52" height="26" rx="4" fill="#f1f5f9" stroke="#334155"/>
  <text x="372" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#16232f">VIN−</text>

  <rect x="542" y="288" width="52" height="26" rx="4" fill="#fef2f2" stroke="#d1332e"/>
  <text x="568" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#a02320">OUT+</text>
  <rect x="542" y="320" width="52" height="26" rx="4" fill="#f1f5f9" stroke="#334155"/>
  <text x="568" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#16232f">OUT−</text>

  <rect x="418" y="288" width="104" height="58" rx="6" fill="#16232f"/>
  <text x="470" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#dbe7de">FET</text>
  <text x="470" y="331" text-anchor="middle" font-size="10" fill="#8fa3bb">der Schalter</text>

  <!-- ============ LEDs ============ -->
  <g>
    <rect x="756" y="128" width="180" height="66" rx="8" fill="#f7f2fb" stroke="#8a5ba8" stroke-width="2.5"/>
    <text x="846" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#16232f">IR-LED 940 nm</text>
    <text x="846" y="172" text-anchor="middle" font-size="11" fill="#6b5a80">links vorn im Deckel</text>
    <circle cx="775" cy="152" r="7" fill="#8a5ba8"/>

    <rect x="756" y="208" width="180" height="66" rx="8" fill="#f7f2fb" stroke="#8a5ba8" stroke-width="2.5"/>
    <text x="846" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#16232f">IR-LED 940 nm</text>
    <text x="846" y="252" text-anchor="middle" font-size="11" fill="#6b5a80">rechts vorn</text>
    <circle cx="775" cy="232" r="7" fill="#8a5ba8"/>

    <rect x="756" y="288" width="180" height="66" rx="8" fill="#f7f2fb" stroke="#8a5ba8" stroke-width="2.5"/>
    <text x="846" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#16232f">IR-LED 940 nm</text>
    <text x="846" y="332" text-anchor="middle" font-size="11" fill="#6b5a80">links hinten</text>
    <circle cx="775" cy="312" r="7" fill="#8a5ba8"/>

    <rect x="756" y="368" width="180" height="66" rx="8" fill="#f7f2fb" stroke="#8a5ba8" stroke-width="2.5"/>
    <text x="846" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#16232f">IR-LED 940 nm</text>
    <text x="846" y="412" text-anchor="middle" font-size="11" fill="#6b5a80">rechts hinten</text>
    <circle cx="775" cy="392" r="7" fill="#8a5ba8"/>
  </g>

  <text x="846" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#16232f">alle vier parallel</text>
  <text x="846" y="478" text-anchor="middle" font-size="11.5" fill="#5b6b7d">alle Plus zusammen,</text>
  <text x="846" y="494" text-anchor="middle" font-size="11.5" fill="#5b6b7d">alle Minus zusammen</text>

  <!-- ============ Erklärkästen ============ -->
  <rect x="24" y="400" width="600" height="88" rx="9" fill="#fff9ec" stroke="#c9a227" stroke-width="2"/>
  <text x="42" y="426" font-size="15" font-weight="bold" fill="#16232f">Warum nicht die LEDs direkt an den Pin?</text>
  <text x="42" y="450" font-size="13" fill="#2b3440">Ein Pin des XIAO darf nur wenige Milliampere liefern — vier LED-Module ziehen rund 80 mA.</text>
  <text x="42" y="472" font-size="13" fill="#2b3440">Der MOSFET ist der Muskel: Ein winziges Signal schaltet den großen Strom. Wie ein Lichtschalter.</text>

  <rect x="24" y="502" width="600" height="98" rx="9" fill="#f3f7f4" stroke="#2f7d4f" stroke-width="2"/>
  <text x="42" y="528" font-size="15" font-weight="bold" fill="#16232f">Und was ist Dimmen (PWM)?</text>
  <text x="42" y="552" font-size="13" fill="#2b3440">Der XIAO schaltet die LEDs 20 000-mal pro Sekunde ein und aus. Sind sie nur 30 % der Zeit an,</text>
  <text x="42" y="574" font-size="13" fill="#2b3440">leuchten sie mit 30 % — ganz ohne Bauteil, das warm wird. Einstellbar als IR_HELLIGKEIT.</text>
  <text x="42" y="594" font-size="12" font-style="italic" fill="#5b6b7d">So schnell, weil es sonst als Pfeifen in der Tonaufnahme landen würde.</text>

  <rect x="648" y="502" width="288" height="98" rx="9" fill="#fef2f2" stroke="#d1332e" stroke-width="2"/>
  <text x="666" y="528" font-size="14" font-weight="bold" fill="#a02320">Beim Kaufen aufpassen</text>
  <text x="666" y="552" font-size="12.5" fill="#2b3440">Auf dem Chip muss <tspan font-weight="bold">D4184</tspan> oder</text>
  <text x="666" y="572" font-size="12.5" fill="#2b3440"><tspan font-weight="bold">AOD4184</tspan> stehen. Ein IRF520</text>
  <text x="666" y="592" font-size="12.5" fill="#2b3440">schaltet bei 3,3 V nicht durch.</text>

</svg>
