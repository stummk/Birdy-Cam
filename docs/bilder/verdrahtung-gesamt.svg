<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1000" height="770" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="768" fill="none" stroke="#d5dbe4" stroke-width="2" rx="6"/>

  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16232f">BirdyCam — der Gesamtplan: was kommt wohin?</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#5b6b7d">Neun Verbindungen, mehr ist es nicht. Die Nummern findest du in der Tabelle im Text wieder.</text>

  <!-- ================= Kabel zuerst ================= -->

  <!-- 1  Panel -> Laderegler -->
  <line x1="190" y1="118" x2="240" y2="118" stroke="#d1332e" stroke-width="4"/>
  <line x1="190" y1="142" x2="240" y2="142" stroke="#2b3440" stroke-width="4"/>

  <!-- 2  Akku -> Laderegler BAT -->
  <line x1="320" y1="305" x2="320" y2="260" stroke="#7a4fa3" stroke-width="5"/>

  <!-- 3  Akku -> Spannungssensor (Y-Kabel) -->
  <line x1="365" y1="381" x2="365" y2="410" stroke="#7a4fa3" stroke-width="5"/>

  <!-- 4  Laderegler USB-A -> XIAO USB-C -->
  <line x1="490" y1="152" x2="560" y2="152" stroke="#8a94a6" stroke-width="8" stroke-linecap="round"/>

  <!-- 5  Spannungssensor -> XIAO D1 -->
  <path d="M 480 436 L 648 436 L 648 380" fill="none" stroke="#d99400" stroke-width="4"/>
  <path d="M 480 458 L 668 458 L 668 380" fill="none" stroke="#2b3440" stroke-width="4"/>

  <!-- 6  XIAO -> MOSFET -->
  <line x1="735" y1="196" x2="800" y2="196" stroke="#d99400" stroke-width="4"/>
  <line x1="735" y1="210" x2="800" y2="210" stroke="#d1332e" stroke-width="4"/>
  <line x1="735" y1="224" x2="800" y2="224" stroke="#2b3440" stroke-width="4"/>

  <!-- 7  MOSFET -> IR-LEDs -->
  <line x1="866" y1="248" x2="866" y2="282" stroke="#d1332e" stroke-width="4"/>
  <line x1="906" y1="248" x2="906" y2="282" stroke="#2b3440" stroke-width="4"/>

  <!-- 8  Lichtschranke -> XIAO -->
  <path d="M 800 414 L 760 414 L 760 300 L 735 300" fill="none" stroke="#e06ba8" stroke-width="4"/>
  <path d="M 800 428 L 775 428 L 775 314 L 735 314" fill="none" stroke="#2b3440" stroke-width="4"/>
  <path d="M 800 442 L 790 442 L 790 328 L 735 328" fill="none" stroke="#d99400" stroke-width="4"/>

  <!-- 9  Kamera-Flachband -->
  <line x1="735" y1="100" x2="800" y2="100" stroke="#b07a3c" stroke-width="9" stroke-linecap="round"/>

  <!-- ================= Kästen ================= -->

  <!-- Solarpanel -->
  <rect x="25" y="78" width="165" height="104" rx="9" fill="#fff8e6" stroke="#c9a227" stroke-width="2.5"/>
  <text x="107" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">Solarpanel</text>
  <text x="107" y="126" text-anchor="middle" font-size="13" fill="#42546b">HPLive 15 W / 12 V</text>
  <text x="107" y="147" text-anchor="middle" font-size="12" fill="#7a6a2a">an der sonnigsten</text>
  <text x="107" y="164" text-anchor="middle" font-size="12" fill="#7a6a2a">Stelle im Garten</text>

  <!-- Laderegler -->
  <rect x="240" y="60" width="250" height="200" rx="9" fill="#eef4fb" stroke="#3b5573" stroke-width="2.5"/>
  <text x="365" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">Waveshare</text>
  <text x="365" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">Solar Power Manager</text>
  <text x="365" y="126" text-anchor="middle" font-size="11.5" fill="#5b6b7d">Laderegler + MPPT + 5-V-Netzteil</text>

  <rect x="252" y="138" width="106" height="26" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="305" y="156" text-anchor="middle" font-size="11.5" fill="#2b3440">SOLAR IN + / −</text>
  <rect x="252" y="170" width="106" height="26" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="305" y="188" text-anchor="middle" font-size="11.5" fill="#2b3440">BAT (JST)</text>
  <rect x="252" y="202" width="106" height="26" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="305" y="220" text-anchor="middle" font-size="11.5" fill="#2b3440">USB IN (Notstrom)</text>

  <rect x="368" y="138" width="110" height="26" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="423" y="156" text-anchor="middle" font-size="11.5" fill="#2b3440">USB-A OUT 5 V</text>
  <rect x="368" y="170" width="110" height="26" rx="4" fill="#fff4f4" stroke="#d1332e"/>
  <text x="423" y="188" text-anchor="middle" font-size="11.5" fill="#a02320">MPPT-SET → 12 V</text>
  <rect x="368" y="202" width="110" height="26" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="423" y="220" text-anchor="middle" font-size="11.5" fill="#2b3440">Schalter → ON</text>

  <text x="365" y="248" text-anchor="middle" font-size="11" fill="#7d8a99">Die Lämpchen auf dem Modul sagen dir, ob alles stimmt.</text>

  <!-- Akku -->
  <rect x="250" y="305" width="230" height="76" rx="9" fill="#f4eefb" stroke="#7a4fa3" stroke-width="2.5"/>
  <text x="365" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">LiPo-Akku 1S</text>
  <text x="365" y="353" text-anchor="middle" font-size="13" fill="#42546b">3,7 V · 5000 mAh</text>
  <text x="365" y="371" text-anchor="middle" font-size="11" fill="#6b5a80">mit Schutzschaltung, JST-PH-2.0-Stecker</text>

  <!-- Spannungssensor -->
  <rect x="250" y="410" width="230" height="76" rx="9" fill="#eef4fb" stroke="#3b5573" stroke-width="2.5"/>
  <text x="365" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">Spannungssensor 0–25 V</text>
  <text x="365" y="458" text-anchor="middle" font-size="12" fill="#42546b">misst den Akkustand für die Website</text>
  <text x="365" y="476" text-anchor="middle" font-size="11" fill="#7d8a99">hängt über ein Y-Kabel am Akku</text>

  <!-- XIAO -->
  <rect x="560" y="60" width="175" height="320" rx="9" fill="#eaf6ef" stroke="#2f7d4f" stroke-width="2.5"/>
  <text x="647" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">XIAO ESP32-S3</text>
  <text x="647" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">Sense</text>
  <text x="647" y="124" text-anchor="middle" font-size="11" fill="#5b6b7d">das Gehirn: Kamera, WLAN,</text>
  <text x="647" y="139" text-anchor="middle" font-size="11" fill="#5b6b7d">Mikrofon, SD-Karte, Website</text>

  <rect x="574" y="150" width="148" height="24" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="648" y="167" text-anchor="middle" font-size="12" fill="#2b3440">USB-C  ← Strom</text>
  <rect x="574" y="180" width="148" height="24" rx="4" fill="#ffffff" stroke="#8fa3bb"/>
  <text x="648" y="197" text-anchor="middle" font-size="12" fill="#2b3440">microSD 32 GB</text>

  <text x="574" y="228" font-size="12" font-weight="bold" fill="#2b3440">Benutzte Pins:</text>
  <rect x="574" y="236" width="148" height="112" rx="5" fill="#ffffff" stroke="#b9c7d6"/>
  <text x="584" y="255" font-size="12" fill="#2b3440">3V3  → Lichtschranke</text>
  <text x="584" y="274" font-size="12" fill="#2b3440">5V   → MOSFET</text>
  <text x="584" y="293" font-size="12" fill="#2b3440">GND → vier Kabel</text>
  <text x="584" y="312" font-size="12" fill="#2b3440">D0   → MOSFET PWM</text>
  <text x="584" y="331" font-size="12" fill="#2b3440">D1   ← Spannung</text>
  <text x="584" y="345" font-size="12" fill="#2b3440">D2   ← Lichtschranke</text>

  <text x="647" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#a02320">D8 · D9 · D10 bleiben frei!</text>

  <!-- Kamera -->
  <rect x="800" y="62" width="172" height="78" rx="9" fill="#eef4fb" stroke="#3b5573" stroke-width="2.5"/>
  <text x="886" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">Kameramodul</text>
  <text x="886" y="108" text-anchor="middle" font-size="12" fill="#42546b">OV2640, ohne IR-Filter</text>
  <text x="886" y="127" text-anchor="middle" font-size="11" fill="#7d8a99">im Deckel des Nistkastens</text>

  <!-- MOSFET -->
  <rect x="800" y="170" width="172" height="78" rx="9" fill="#eef4fb" stroke="#3b5573" stroke-width="2.5"/>
  <text x="886" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">MOSFET-Modul</text>
  <text x="886" y="216" text-anchor="middle" font-size="12" fill="#42546b">D4184, 2 + 3 Anschlüsse</text>
  <text x="886" y="235" text-anchor="middle" font-size="11" fill="#7d8a99">der Lichtschalter fürs IR-Licht</text>

  <!-- IR-LEDs -->
  <rect x="800" y="282" width="172" height="70" rx="9" fill="#f7f2fb" stroke="#8a5ba8" stroke-width="2.5"/>
  <text x="886" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">4 × IR-LED 940 nm</text>
  <text x="886" y="328" text-anchor="middle" font-size="12" fill="#42546b">alle parallel</text>
  <text x="886" y="345" text-anchor="middle" font-size="11" fill="#7d8a99">im Deckel, unsichtbares Licht</text>

  <!-- Lichtschranke -->
  <rect x="800" y="390" width="172" height="76" rx="9" fill="#eef4fb" stroke="#3b5573" stroke-width="2.5"/>
  <text x="886" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#16232f">Lichtschranke</text>
  <text x="886" y="436" text-anchor="middle" font-size="12" fill="#42546b">am Einflugloch</text>
  <text x="886" y="455" text-anchor="middle" font-size="11" fill="#7d8a99">zählt jeden Vogel</text>

  <!-- ================= Nummern ================= -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <circle cx="215" cy="130" r="14" fill="#16232f"/><text x="215" y="135" fill="#ffffff">1</text>
    <circle cx="320" cy="283" r="14" fill="#16232f"/><text x="320" y="288" fill="#ffffff">2</text>
    <circle cx="365" cy="396" r="14" fill="#16232f"/><text x="365" y="401" fill="#ffffff">3</text>
    <circle cx="525" cy="152" r="14" fill="#16232f"/><text x="525" y="157" fill="#ffffff">4</text>
    <circle cx="560" cy="436" r="14" fill="#16232f"/><text x="560" y="441" fill="#ffffff">5</text>
    <circle cx="768" cy="176" r="14" fill="#16232f"/><text x="768" y="181" fill="#ffffff">6</text>
    <circle cx="886" cy="265" r="14" fill="#16232f"/><text x="886" y="270" fill="#ffffff">7</text>
    <circle cx="740" cy="378" r="14" fill="#16232f"/><text x="740" y="383" fill="#ffffff">8</text>
    <circle cx="768" cy="76" r="14" fill="#16232f"/><text x="768" y="81" fill="#ffffff">9</text>
  </g>

  <!-- ================= Legende ================= -->
  <rect x="25" y="520" width="300" height="226" rx="9" fill="#fbfcfd" stroke="#b9c7d6" stroke-width="2"/>
  <text x="42" y="548" font-size="15" font-weight="bold" fill="#16232f">Was die Farben bedeuten</text>

  <line x1="44" y1="574" x2="86" y2="574" stroke="#d1332e" stroke-width="4"/>
  <text x="98" y="579" font-size="13" fill="#2b3440">rot = Plus (+), der Hinweg</text>

  <line x1="44" y1="602" x2="86" y2="602" stroke="#2b3440" stroke-width="4"/>
  <text x="98" y="607" font-size="13" fill="#2b3440">schwarz = Minus (−), „GND“</text>

  <line x1="44" y1="630" x2="86" y2="630" stroke="#d99400" stroke-width="4"/>
  <text x="98" y="635" font-size="13" fill="#2b3440">gelb = Signal, eine Nachricht</text>

  <line x1="44" y1="658" x2="86" y2="658" stroke="#e06ba8" stroke-width="4"/>
  <text x="98" y="663" font-size="13" fill="#2b3440">rosa = 3,3 V für Sensoren</text>

  <line x1="44" y1="686" x2="86" y2="686" stroke="#8a94a6" stroke-width="8" stroke-linecap="round"/>
  <text x="98" y="691" font-size="13" fill="#2b3440">fertiges USB-Kabel</text>

  <line x1="44" y1="712" x2="86" y2="712" stroke="#b07a3c" stroke-width="9" stroke-linecap="round"/>
  <text x="98" y="717" font-size="13" fill="#2b3440">Flachbandkabel (Kamera)</text>

  <line x1="44" y1="736" x2="86" y2="736" stroke="#7a4fa3" stroke-width="5"/>
  <text x="98" y="741" font-size="13" fill="#2b3440">Akkukabel mit Stecker</text>

  <!-- ================= Merksatz ================= -->
  <rect x="345" y="520" width="300" height="226" rx="9" fill="#fff9ec" stroke="#c9a227" stroke-width="2"/>
  <text x="362" y="548" font-size="15" font-weight="bold" fill="#16232f">Die eine Regel</text>
  <text x="362" y="576" font-size="13" fill="#42546b">Strom ist wie Wasser in Rohren.</text>
  <text x="362" y="596" font-size="13" fill="#42546b">Er muss hin — und wieder zurück.</text>
  <text x="362" y="624" font-size="13" fill="#42546b">Das Rückrohr heißt GND, und es</text>
  <text x="362" y="644" font-size="13" fill="#42546b">ist immer schwarz. Alle schwarzen</text>
  <text x="362" y="664" font-size="13" fill="#42546b">Kabel müssen irgendwie</text>
  <text x="362" y="684" font-size="13" fill="#42546b">zusammenhängen — sonst fließt</text>
  <text x="362" y="704" font-size="13" fill="#42546b">überhaupt nichts.</text>
  <text x="362" y="732" font-size="12" font-style="italic" fill="#7a6a2a">Das erklärt 90 % aller Fälle von</text>
  <text x="362" y="748" font-size="12" font-style="italic" fill="#7a6a2a">„warum geht das nicht?“</text>

  <!-- ================= Wo sitzt was ================= -->
  <rect x="665" y="520" width="310" height="226" rx="9" fill="#f3f7f4" stroke="#2f7d4f" stroke-width="2"/>
  <text x="682" y="548" font-size="15" font-weight="bold" fill="#16232f">Wo sitzt was?</text>

  <text x="682" y="576" font-size="13" font-weight="bold" fill="#2b3440">Im Nistkasten (innen):</text>
  <text x="682" y="595" font-size="12.5" fill="#42546b">nur Kamera, 4 IR-LEDs,</text>
  <text x="682" y="612" font-size="12.5" fill="#42546b">Lichtschranke und Kabel.</text>

  <text x="682" y="640" font-size="13" font-weight="bold" fill="#2b3440">In der Box außen am Kasten:</text>
  <text x="682" y="659" font-size="12.5" fill="#42546b">XIAO, Laderegler, Akku.</text>
  <text x="682" y="676" font-size="12.5" fill="#42546b">Keine Wärme, kein Geruch im Nest.</text>

  <text x="682" y="704" font-size="13" font-weight="bold" fill="#2b3440">Im Garten:</text>
  <text x="682" y="723" font-size="12.5" fill="#42546b">das Solarpanel, per Kabel an der</text>
  <text x="682" y="740" font-size="12.5" fill="#42546b">sonnigsten Stelle — nie am Kasten.</text>

</svg>
