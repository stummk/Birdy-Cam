<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="960" height="790" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="788" fill="none" stroke="#d5dbe4" stroke-width="2" rx="6"/>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16232f">Der Laderegler — Waveshare Solar Power Manager</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#5b6b7d">Schematisch gezeichnet. Die Beschriftungen stehen genauso auf dem echten Modul.</text>

  <!-- ================= Verbindungslinien zu den Beschriftungen ================= -->
  <line x1="248" y1="200" x2="316" y2="156" stroke="#8fa3bb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="248" y1="322" x2="308" y2="278" stroke="#8fa3bb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="248" y1="442" x2="322" y2="398" stroke="#8fa3bb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="760" y1="150" x2="646" y2="150" stroke="#8fa3bb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="760" y1="272" x2="652" y2="272" stroke="#8fa3bb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="760" y1="392" x2="600" y2="392" stroke="#8fa3bb" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- ================= Die Platine ================= -->
  <rect x="300" y="100" width="360" height="330" rx="12" fill="#2f6b4b" stroke="#1d4530" stroke-width="3"/>
  <circle cx="316" cy="116" r="5" fill="#1d4530"/>
  <circle cx="644" cy="116" r="5" fill="#1d4530"/>
  <circle cx="316" cy="414" r="5" fill="#1d4530"/>
  <circle cx="644" cy="414" r="5" fill="#1d4530"/>
  <text x="480" y="90" text-anchor="middle" font-size="12" fill="#5b6b7d">Oberseite, ca. 65 × 56 mm</text>

  <!-- SOLAR IN Schraubklemme -->
  <rect x="316" y="132" width="96" height="36" rx="4" fill="#3fa34d" stroke="#256b31" stroke-width="2"/>
  <circle cx="338" cy="150" r="7" fill="#f0f2f5" stroke="#256b31"/>
  <circle cx="366" cy="150" r="7" fill="#f0f2f5" stroke="#256b31"/>
  <text x="338" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#a02320">+</text>
  <text x="366" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#16232f">−</text>
  <text x="390" y="155" text-anchor="middle" font-size="10" fill="#ffffff">IN</text>

  <!-- DC-Buchse -->
  <rect x="424" y="132" width="56" height="36" rx="5" fill="#16232f" stroke="#0b1219" stroke-width="2"/>
  <circle cx="452" cy="150" r="10" fill="#3a4652"/>
  <circle cx="452" cy="150" r="4" fill="#16232f"/>
  <text x="452" y="184" text-anchor="middle" font-size="10" fill="#dbe7de">DC-Buchse</text>

  <!-- Micro-USB IN -->
  <rect x="308" y="256" width="52" height="32" rx="4" fill="#b8bfc9" stroke="#7d8a99" stroke-width="2"/>
  <rect x="316" y="264" width="36" height="16" rx="3" fill="#5b6b7d"/>
  <text x="334" y="304" text-anchor="middle" font-size="10" fill="#dbe7de">USB IN</text>

  <!-- USB-A OUT -->
  <rect x="600" y="240" width="52" height="64" rx="4" fill="#b8bfc9" stroke="#7d8a99" stroke-width="2"/>
  <rect x="608" y="252" width="36" height="40" rx="3" fill="#2b6cb0"/>
  <text x="626" y="322" text-anchor="middle" font-size="10" fill="#dbe7de">USB OUT</text>

  <!-- 2x2 Pins -->
  <rect x="552" y="252" width="34" height="34" rx="3" fill="#e8c547" stroke="#a8892c" stroke-width="2"/>
  <circle cx="561" cy="261" r="3" fill="#5b4a12"/><circle cx="577" cy="261" r="3" fill="#5b4a12"/>
  <circle cx="561" cy="277" r="3" fill="#5b4a12"/><circle cx="577" cy="277" r="3" fill="#5b4a12"/>
  <text x="569" y="302" text-anchor="middle" font-size="10" fill="#dbe7de">5 V Pins</text>

  <!-- LED-Reihe -->
  <text x="480" y="212" text-anchor="middle" font-size="11" fill="#c6ded0">Akkustand</text>
  <circle cx="432" cy="228" r="7" fill="#4ade80" stroke="#1d4530"/>
  <circle cx="458" cy="228" r="7" fill="#4ade80" stroke="#1d4530"/>
  <circle cx="484" cy="228" r="7" fill="#4ade80" stroke="#1d4530"/>
  <circle cx="510" cy="228" r="7" fill="#2f6b4b" stroke="#1d4530"/>

  <circle cx="396" cy="340" r="7" fill="#facc15" stroke="#1d4530"/>
  <text x="410" y="345" font-size="10" fill="#dbe7de">Solar Charge</text>
  <circle cx="396" cy="364" r="7" fill="#4ade80" stroke="#1d4530"/>
  <text x="410" y="369" font-size="10" fill="#dbe7de">Solar Done</text>
  <circle cx="530" cy="340" r="7" fill="#ef4444" stroke="#1d4530"/>
  <text x="544" y="345" font-size="10" fill="#dbe7de">Solar Warning</text>
  <circle cx="530" cy="364" r="7" fill="#ef4444" stroke="#1d4530"/>
  <text x="544" y="369" font-size="10" fill="#dbe7de">Battery Warning</text>

  <!-- Akkubuchse -->
  <rect x="322" y="376" width="66" height="32" rx="4" fill="#f0f2f5" stroke="#7d8a99" stroke-width="2"/>
  <rect x="332" y="384" width="8" height="16" rx="2" fill="#d1332e"/>
  <rect x="346" y="384" width="8" height="16" rx="2" fill="#2b3440"/>
  <text x="376" y="398" text-anchor="middle" font-size="10" fill="#5b6b7d">BAT</text>

  <!-- Schalter -->
  <rect x="404" y="378" width="62" height="28" rx="6" fill="#16232f" stroke="#0b1219" stroke-width="2"/>
  <rect x="408" y="382" width="26" height="20" rx="4" fill="#dbe7de"/>
  <text x="435" y="424" text-anchor="middle" font-size="10" fill="#dbe7de">ON / OFF</text>

  <!-- 14500-Halter -->
  <rect x="484" y="376" width="150" height="34" rx="6" fill="none" stroke="#8fbfa4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="559" y="398" text-anchor="middle" font-size="10" fill="#c6ded0">14500-Halter (brauchen wir nicht)</text>

  <!-- ================= Unterseite: MPPT SET ================= -->
  <rect x="700" y="452" width="236" height="120" rx="9" fill="#fff4f4" stroke="#d1332e" stroke-width="2.5"/>
  <text x="818" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#a02320">Unterseite: MPPT-SET</text>
  <rect x="738" y="490" width="160" height="40" rx="4" fill="#16232f"/>
  <rect x="746" y="496" width="22" height="28" rx="2" fill="#8fa3bb"/>
  <rect x="776" y="496" width="22" height="28" rx="2" fill="#8fa3bb"/>
  <rect x="806" y="496" width="22" height="28" rx="2" fill="#4ade80"/>
  <rect x="836" y="496" width="22" height="28" rx="2" fill="#8fa3bb"/>
  <rect x="866" y="496" width="22" height="28" rx="2" fill="#8fa3bb"/>
  <text x="757" y="546" text-anchor="middle" font-size="10" fill="#5b6b7d">6V</text>
  <text x="787" y="546" text-anchor="middle" font-size="10" fill="#5b6b7d">9V</text>
  <text x="817" y="546" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d7a3f">12V</text>
  <text x="847" y="546" text-anchor="middle" font-size="10" fill="#5b6b7d">18V</text>
  <text x="877" y="546" text-anchor="middle" font-size="10" fill="#5b6b7d">24V</text>
  <text x="818" y="565" text-anchor="middle" font-size="11" fill="#a02320">Unser Panel ist 12 V → 12V wählen</text>

  <!-- ================= Beschriftungen links ================= -->
  <g font-size="13" fill="#2b3440">
    <circle cx="36" cy="140" r="14" fill="#16232f"/><text x="36" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
    <text x="60" y="132" font-size="14" font-weight="bold" fill="#16232f">SOLAR IN — grüne Klemme</text>
    <text x="60" y="153" font-size="12.5">Hier kommt das Solarpanel an.</text>
    <text x="60" y="172" font-size="12.5">Rote Ader in <tspan font-weight="bold">+</tspan>, schwarze in <tspan font-weight="bold">−</tspan>,</text>
    <text x="60" y="191" font-size="12.5">Schräubchen festziehen. Fertig.</text>

    <circle cx="36" cy="262" r="14" fill="#16232f"/><text x="36" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
    <text x="60" y="254" font-size="14" font-weight="bold" fill="#16232f">USB IN — die Notfall-Buchse</text>
    <text x="60" y="275" font-size="12.5">Nach einer Regenwoche eine</text>
    <text x="60" y="294" font-size="12.5">Powerbank anstecken — sie lädt</text>
    <text x="60" y="313" font-size="12.5">den Akku wie die Sonne.</text>

    <circle cx="36" cy="382" r="14" fill="#16232f"/><text x="36" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
    <text x="60" y="374" font-size="14" font-weight="bold" fill="#16232f">BAT — der Akkustecker</text>
    <text x="60" y="395" font-size="12.5">Der weiße JST-Stecker passt nur</text>
    <text x="60" y="414" font-size="12.5">in eine Richtung. Nicht drücken,</text>
    <text x="60" y="433" font-size="12.5">wenn er nicht will.</text>
  </g>

  <!-- ================= Beschriftungen rechts ================= -->
  <g font-size="13" fill="#2b3440">
    <circle cx="776" cy="140" r="14" fill="#16232f"/><text x="776" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
    <text x="798" y="132" font-size="14" font-weight="bold" fill="#16232f">USB OUT — 5 V</text>
    <text x="798" y="153" font-size="12.5">Ein normales USB-Kabel von</text>
    <text x="798" y="172" font-size="12.5">hier zum USB-C des XIAO.</text>
    <text x="798" y="191" font-size="12.5">Mehr ist es nicht.</text>

    <circle cx="776" cy="262" r="14" fill="#16232f"/><text x="776" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
    <text x="798" y="254" font-size="14" font-weight="bold" fill="#16232f">Schalter auf ON</text>
    <text x="798" y="275" font-size="12.5">Auf OFF ist der Akku</text>
    <text x="798" y="294" font-size="12.5">abgeklemmt, nichts geht.</text>
    <text x="798" y="313" font-size="12.5">Klassischer Suchfehler.</text>

    <circle cx="776" cy="382" r="14" fill="#16232f"/><text x="776" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
    <text x="798" y="374" font-size="14" font-weight="bold" fill="#16232f">MPPT-SET auf 12 V</text>
    <text x="798" y="395" font-size="12.5">Der Schiebeschalter auf</text>
    <text x="798" y="414" font-size="12.5">der <tspan font-weight="bold">Rückseite</tspan> — siehe unten.</text>
  </g>

  <!-- ================= LED-Ampel ================= -->
  <rect x="24" y="452" width="650" height="316" rx="9" fill="#fbfcfd" stroke="#b9c7d6" stroke-width="2"/>
  <text x="44" y="480" font-size="15" font-weight="bold" fill="#16232f">Die Lämpchen sagen dir alles — kein Messgerät nötig</text>

  <circle cx="56" cy="512" r="9" fill="#facc15" stroke="#a8892c"/>
  <text x="80" y="517" font-size="13" fill="#2b3440"><tspan font-weight="bold">Solar Charge</tspan> leuchtet — die Sonne lädt gerade. So soll es sein.</text>

  <circle cx="56" cy="548" r="9" fill="#4ade80" stroke="#256b31"/>
  <text x="80" y="553" font-size="13" fill="#2b3440"><tspan font-weight="bold">Solar Done</tspan> leuchtet — der Akku ist voll. Auch gut.</text>

  <circle cx="56" cy="584" r="9" fill="#ef4444" stroke="#a02320"/>
  <text x="80" y="589" font-size="13" fill="#2b3440"><tspan font-weight="bold">Solar Warning</tspan> leuchtet — die beiden Paneladern sind vertauscht.</text>
  <text x="80" y="607" font-size="13" fill="#a02320">Panel abklemmen, Adern tauschen, fertig. Kaputt geht dabei nichts.</text>

  <circle cx="56" cy="640" r="9" fill="#ef4444" stroke="#a02320"/>
  <text x="80" y="645" font-size="13" fill="#2b3440"><tspan font-weight="bold">Battery Warning</tspan> leuchtet — der Akku hängt verkehrt herum dran.</text>
  <text x="80" y="663" font-size="13" font-weight="bold" fill="#a02320">Jetzt auf keinen Fall zusätzlich Strom anstecken — erst richtig stecken!</text>

  <circle cx="44" cy="700" r="7" fill="#4ade80" stroke="#256b31"/>
  <circle cx="60" cy="700" r="7" fill="#4ade80" stroke="#256b31"/>
  <circle cx="76" cy="700" r="7" fill="#4ade80" stroke="#256b31"/>
  <circle cx="92" cy="700" r="7" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="112" y="705" font-size="13" fill="#2b3440"><tspan font-weight="bold">Vier Akku-Lämpchen</tspan> = Tankanzeige. Vier an ≈ voll, keins an ≈ leer.</text>
  <text x="112" y="723" font-size="12.5" fill="#5b6b7d">Im Betrieb siehst du denselben Wert bequemer auf der Website.</text>
  <text x="44" y="752" font-size="12.5" font-style="italic" fill="#5b6b7d">Blinken „Charge“ und „Done“ abwechselnd, ist kein Akku dran oder der Schalter steht auf OFF.</text>

</svg>
