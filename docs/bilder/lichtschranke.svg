<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="598" fill="none" stroke="#d5dbe4" stroke-width="2" rx="6"/>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16232f">Die Lichtschranke im Einflugloch</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#5b6b7d">Ein unsichtbarer Strahl quer durch das Loch. Fliegt ein Vogel durch, bricht er ihn — und wird gezählt.</text>

  <!-- ================= Ansicht von vorn ================= -->
  <text x="160" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#16232f">So sieht man es von außen</text>

  <rect x="50" y="106" width="220" height="230" rx="6" fill="#e8d5b7" stroke="#8a6a3c" stroke-width="3"/>
  <line x1="50" y1="150" x2="270" y2="150" stroke="#c4a678" stroke-width="1.5"/>
  <line x1="50" y1="210" x2="270" y2="210" stroke="#c4a678" stroke-width="1.5"/>
  <line x1="50" y1="270" x2="270" y2="270" stroke="#c4a678" stroke-width="1.5"/>

  <circle cx="160" cy="180" r="34" fill="#3a2c1c" stroke="#6b543a" stroke-width="2"/>
  <text x="160" y="130" text-anchor="middle" font-size="12" fill="#6b543a">Einflugloch Ø 28–32 mm</text>

  <circle cx="112" cy="224" r="8" fill="#4a5a6b" stroke="#2b3440" stroke-width="2"/>
  <circle cx="208" cy="224" r="8" fill="#4a5a6b" stroke="#2b3440" stroke-width="2"/>
  <line x1="112" y1="224" x2="208" y2="224" stroke="#d1332e" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="112" y="256" text-anchor="middle" font-size="11" fill="#2b3440">Sender</text>
  <text x="208" y="256" text-anchor="middle" font-size="11" fill="#2b3440">Empfänger</text>
  <text x="160" y="290" text-anchor="middle" font-size="11.5" fill="#5b6b7d">Beide sitzen <tspan font-weight="bold">neben</tspan> dem Loch,</text>
  <text x="160" y="307" text-anchor="middle" font-size="11.5" fill="#5b6b7d">5 mm unter der Lochmitte —</text>
  <text x="160" y="324" text-anchor="middle" font-size="11.5" fill="#5b6b7d">nie im Flugweg.</text>

  <!-- ================= Schnitt von oben ================= -->
  <text x="480" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#16232f">Von oben in die Wand geschaut</text>

  <rect x="330" y="140" width="300" height="60" fill="#e8d5b7" stroke="#8a6a3c" stroke-width="3"/>
  <rect x="440" y="140" width="80" height="60" fill="#ffffff" stroke="#8a6a3c" stroke-width="2"/>
  <text x="480" y="130" text-anchor="middle" font-size="11" fill="#6b543a">das Loch</text>

  <rect x="398" y="152" width="30" height="36" rx="4" fill="#4a5a6b" stroke="#2b3440" stroke-width="2"/>
  <rect x="532" y="152" width="30" height="36" rx="4" fill="#4a5a6b" stroke="#2b3440" stroke-width="2"/>
  <line x1="428" y1="170" x2="532" y2="170" stroke="#d1332e" stroke-width="3"/>
  <polygon points="524,165 534,170 524,175" fill="#d1332e"/>
  <text x="480" y="162" text-anchor="middle" font-size="10.5" fill="#a02320">IR-Strahl</text>

  <text x="360" y="226" font-size="11.5" fill="#5b6b7d">außen</text>
  <text x="590" y="226" font-size="11.5" fill="#5b6b7d">innen</text>

  <!-- Vogel -->
  <ellipse cx="480" cy="256" rx="26" ry="16" fill="#6b8ba3"/>
  <circle cx="502" cy="248" r="9" fill="#6b8ba3"/>
  <polygon points="510,248 522,252 510,256" fill="#d99400"/>
  <circle cx="505" cy="245" r="2" fill="#16232f"/>
  <text x="480" y="292" text-anchor="middle" font-size="12" fill="#2b3440">Vogel unterbricht den Strahl</text>
  <text x="480" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f7d4f">→ +1 Besuch</text>

  <!-- Tipp -->
  <rect x="330" y="326" width="300" height="66" rx="8" fill="#fff9ec" stroke="#c9a227" stroke-width="2"/>
  <text x="346" y="348" font-size="12.5" font-weight="bold" fill="#16232f">Tipp gegen Fehlalarme</text>
  <text x="346" y="368" font-size="12" fill="#42546b">Ein 5 mm langes Stück Strohhalm über den</text>
  <text x="346" y="385" font-size="12" fill="#42546b">Empfänger — sonst blendet ihn die Sonne.</text>

  <!-- ================= Anschluss ================= -->
  <text x="800" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#16232f">Drei Kabel zum XIAO</text>

  <rect x="676" y="110" width="120" height="150" rx="8" fill="#eef4fb" stroke="#3b5573" stroke-width="2.5"/>
  <text x="736" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#16232f">Licht-</text>
  <text x="736" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#16232f">schranke</text>
  <rect x="690" y="164" width="92" height="24" rx="4" fill="#fdf2f8" stroke="#a3477b"/>
  <text x="736" y="181" text-anchor="middle" font-size="12" fill="#a3477b">VCC</text>
  <rect x="690" y="194" width="92" height="24" rx="4" fill="#f1f5f9" stroke="#334155"/>
  <text x="736" y="211" text-anchor="middle" font-size="12" fill="#16232f">GND</text>
  <rect x="690" y="224" width="92" height="24" rx="4" fill="#fffbeb" stroke="#d99400"/>
  <text x="736" y="241" text-anchor="middle" font-size="12" fill="#92400e">OUT</text>

  <line x1="782" y1="176" x2="856" y2="176" stroke="#e06ba8" stroke-width="4"/>
  <line x1="782" y1="206" x2="856" y2="206" stroke="#2b3440" stroke-width="4"/>
  <line x1="782" y1="236" x2="856" y2="236" stroke="#d99400" stroke-width="4"/>

  <rect x="856" y="110" width="80" height="150" rx="8" fill="#eaf6ef" stroke="#2f7d4f" stroke-width="2.5"/>
  <text x="896" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#16232f">XIAO</text>
  <text x="896" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a3477b">3V3</text>
  <text x="896" y="211" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#16232f">GND</text>
  <text x="896" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">D2</text>

  <rect x="676" y="276" width="260" height="116" rx="8" fill="#fef2f2" stroke="#d1332e" stroke-width="2"/>
  <text x="692" y="300" font-size="13" font-weight="bold" fill="#a02320">VCC an 3V3 — nicht an 5V</text>
  <text x="692" y="322" font-size="12" fill="#42546b">Sonst schickt der Sensor 5 V zurück in</text>
  <text x="692" y="340" font-size="12" fill="#42546b">einen Pin, der 3,3 V erwartet. Der ESP32</text>
  <text x="692" y="358" font-size="12" fill="#42546b">verzeiht das meist — aber warum sollte</text>
  <text x="692" y="376" font-size="12" fill="#42546b">man es riskieren?</text>

  <!-- ================= Was die Software daraus macht ================= -->
  <rect x="24" y="416" width="912" height="164" rx="9" fill="#f3f7f4" stroke="#2f7d4f" stroke-width="2"/>
  <text x="44" y="443" font-size="15" font-weight="bold" fill="#16232f">Was das Programm daraus macht</text>

  <text x="44" y="472" font-size="13" fill="#2b3440"><tspan font-weight="bold">Einmal unterbrochen</tspan> = ein Durchflug.</text>
  <text x="44" y="496" font-size="13" fill="#2b3440"><tspan font-weight="bold">Zweimal mit Pause dazwischen</tspan> = Einflug und Ausflug — die Pause ist die Aufenthaltsdauer.</text>
  <text x="44" y="520" font-size="13" fill="#2b3440"><tspan font-weight="bold">Kürzer als 30 ms</tspan> = kein Vogel, sondern ein Insekt oder Zittern. Wird ignoriert.</text>
  <text x="44" y="544" font-size="13" fill="#2b3440"><tspan font-weight="bold">Länger als 2 Sekunden</tspan> = ein Blatt oder Schmutz im Loch. Wird auch ignoriert.</text>
  <text x="44" y="568" font-size="12.5" font-style="italic" fill="#5b6b7d">Deshalb zeigt die Website echte Messwerte statt Schätzungen — reine Bilderkennung springt auch auf Sonnenflecken an.</text>

</svg>
